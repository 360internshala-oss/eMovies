name: media-probe (temporary)

on:
  push:
    branches: [arena/3d841a48-emovies]
    paths: ['.github/workflows/media-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /play and the media URLs
        run: |
          set -u
          API="https://filmy-flow-api.vercel.app"
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse

          API = "https://filmy-flow-api.vercel.app"
          out = []

          def curl(args, timeout=30):
              r = subprocess.run(["curl", "-sS", "-m", str(timeout), *args], capture_output=True, text=True)
              return r.stdout

          def head(url, label, extra=()):
              r = subprocess.run(["curl", "-sS", "-o", "/dev/null", "-m", "30", "-D", "-", *extra, url],
                                 capture_output=True, text=True)
              hdrs = [l.strip() for l in r.stdout.splitlines() if re.match(r'^(HTTP/|content-type|content-length|access-control-allow-origin|location)', l, re.I)]
              out.append(f"[{label}] {url[:120]}")
              out.append("   " + " | ".join(hdrs[:6]) + f" | body={r.stdout.splitlines()[-1][:80] if r.stdout else ''}")

          q = urllib.parse.urlencode({"subjectId": "2190807691784770592", "detailPath": "lucifer-UQASHYbVPB2", "se": 1, "ep": 1})
          body = curl([f"{API}/play?{q}"], 40)
          data = json.loads(body)

          def shape(node, depth=0):
              if depth > 3: return '...'
              if isinstance(node, dict):
                  return {k: shape(v, depth + 1) for k, v in list(node.items())[:24]}
              if isinstance(node, list):
                  return [shape(node[0], depth + 1)] if node else []
              if isinstance(node, str):
                  return node[:90]
              return node

          out.append("SHAPE " + json.dumps(shape(data))[:2500])
          up = data.get("upstream", {}).get("data", {}) or {}
          out.append("STREAM KEYS " + str([sorted(s.keys()) for s in (data.get("streams") or [])][:2]))
          out.append("LAST STREAM " + json.dumps({k: (str(v)[:150]) for k, v in (data.get("streams") or [{}])[-1].items()})[:1200])

          streams = data.get("streams") or []
          mp4 = [s for s in streams if str(s.get("url", "")).find(".mp4") >= 0]
          target = (mp4 or streams or [{}])[0]
          url = target.get("url", "")
          proxy = target.get("proxy_url", "")
          out.append(f"TARGET res={target.get('resolutions')} codec={target.get('codecName')} url={url[:100]}")

          head(url, "cdn-direct")
          head(url, "cdn-direct-noreferer", ("-H", "Referer: "))
          head(url, "cdn-direct-range", ("-H", "Range: bytes=0-1023"))
          if proxy:
              full = proxy if proxy.startswith("http") else API + proxy
              head(full, "api-stream")
              head(full, "api-stream-range", ("-H", "Range: bytes=0-1023"))
              head(full, "api-stream-accept", ("-H", "Accept: */*", "-H", "User-Agent: Mozilla/5.0"))
          head(f"{API}/api/stream/2190807691784770592", "api-stream-id")
          head(f"{API}/stream?u={urllib.parse.quote(url, safe='')}&cookie=x", "api-stream-cookie")

          text = "\n".join(out)
          esc = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error::" + esc[:60000])
          open("probe.txt", "w").write(text)
          PY

      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-probe
          path: probe.txt
          if-no-files-found: warn
