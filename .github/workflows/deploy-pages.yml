name: Deploy to GitHub Pages

# Builds the static SPA and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The site is served from https://<owner>.github.io/<repo>/, so the build is
# produced with VITE_BASE_PATH=/<repo>/ and the router strips that base from
# the address bar (see src/router/base.ts).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; queue the newest instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22: matches the version the suite is verified on. jsdom >= 30
      # requires Node 22.22+, so the tests need a modern runtime.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Results are captured as an artifact so failures are diagnosable even
      # when the runner's log stream is unavailable.
      - name: Unit + integration tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml 2>&1 | tee test-results/vitest.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: test-results
          if-no-files-found: warn

      # Failures become ::error:: annotations so they are readable through the
      # checks API even when artifact downloads / log streams are unavailable.
      - name: Fail on test failures
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed — see the vitest-report artifact."
          python3 - <<'PY'
          import os, re
          path = 'test-results/vitest.txt'
          text = open(path, encoding='utf-8', errors='replace').read() if os.path.exists(path) else 'no test output'
          # Keep the interesting lines, strip ANSI colour codes.
          clean = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = [l for l in clean.splitlines() if re.search(r'(FAIL|×|AssertionError|Error:|FAIL )', l)]
          body = '\n'.join(lines[-40:]) or clean[-3000:]
          print('::error::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY
          exit 1

      - name: Resolve Pages base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "path=$base" >> "$GITHUB_OUTPUT"
          echo "Deploying to base path: $base"

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_API_BASE_URL: https://filmy-flow-api.vercel.app
        run: npm run build

      # GitHub Pages answers unknown paths with 404.html. Shipping a copy of the
      # SPA shell makes deep links (/title/..., /watch/...) work: the app boots
      # and resolves the route from the address bar, base path included.
      - name: Add SPA fallback and .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # `enablement: true` creates the Pages site (build type: "GitHub Actions")
      # on the first run, so no manual Settings step is required.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Post-deploy smoke test: proves the published site actually serves the app
  # shell, its hashed assets and a deep link through the 404.html fallback.
  smoke:
    name: Smoke-test the published site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live site
        run: |
          site="${{ needs.deploy.outputs.page_url }}"
          site="${site%/}"
          {
            echo "site: $site"
            echo "root: $(curl -sS -o /dev/null -w '%{http_code}' "$site/")"
            index="$(curl -sS "$site/")"
            asset="$(printf '%s' "$index" | grep -o 'src="[^"]*\.js"' | head -1 | cut -d'"' -f2)"
            echo "asset path: $asset"
            echo "asset: $(curl -sS -o /dev/null -w '%{http_code}' "$site$asset")"
            echo "deep link: $(curl -sS -o /dev/null -w '%{http_code}' "$site/title/lucifer-UQASHYbVPB2")"
            deep="$(curl -sS "$site/title/lucifer-UQASHYbVPB2")"
            printf '%s' "$deep" | grep -q 'eMovies' && echo "deep link serves the SPA shell: yes" || echo "deep link serves the SPA shell: NO"
          } | tee smoke.txt

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke
          path: smoke.txt
