name: cors-probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9005430d-emovies
      - name: Probe media + subtitles
        run: |
          set -x
          PLAY=$(curl -s "https://filmy-flow-api.vercel.app/play?subjectId=2190807691784770592&detailPath=lucifer-UQASHYbVPB2&se=1&ep=1")
          echo "$PLAY" > play.json
          MP4=$(python3 -c "import json;d=json.load(open('play.json'));print(d['streams'][2]['url']);print(d['streams'][2]['id'], file=open('streamid.txt','w'))")
          SID=$(python3 -c "import json;d=json.load(open('play.json'));print(d['streams'][2]['id'])")
          CAP=$(curl -s "https://filmy-flow-api.vercel.app/caption?id=$SID&subjectId=2190807691784770592&detailPath=lucifer-UQASHYbVPB2&format=MP4")
          echo "$CAP" > cap.json
          SUBURL=$(python3 -c "import json;d=json.load(open('cap.json'));c=d['data']['captions'];print(c[2]['url'])")
          {
          echo "=== caption count: $(python3 -c "import json;d=json.load(open('cap.json'));print(len(d['data']['captions']))") ==="
          echo "=== MP4 direct: HEAD with Origin+Referer ==="
          curl -s -D - -o /dev/null -H "Origin: https://example.com" -H "Referer: https://example.com/" "$MP4" | head -20
          echo "=== MP4 direct: range request with Origin ==="
          curl -s -D - -o /dev/null -H "Origin: https://example.com" -H "Range: bytes=0-1023" "$MP4" | head -20
          echo "=== MP4 via /stream proxy (no range) ==="
          curl -s -m 25 -D - -o /dev/null "https://filmy-flow-api.vercel.app/stream?u=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$MP4")" | head -20
          echo "=== subtitle direct: headers with Origin ==="
          curl -s -m 20 -D - -o sub.srt -H "Origin: https://example.com" "$SUBURL" | head -20
          echo "--- subtitle body head ---"
          head -c 240 sub.srt
          echo ""
          echo "=== subtitle via /stream proxy ==="
          curl -s -m 25 -D - -o sub-proxy.txt "https://filmy-flow-api.vercel.app/stream?u=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$SUBURL")" | head -20
          echo "--- proxied subtitle body head ---"
          head -c 240 sub-proxy.txt
          } > cors-probe.txt 2>&1
          cat cors-probe.txt
      - name: Commit results
        run: |
          git config user.name "cors-probe"
          git config user.email "probe@local"
          git add cors-probe.txt
          git commit -m "chore: media probe output" || true
          git push
